<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🌟 星光鎮 v2.0：夢幻小魔女與自然牧場 (Starlight Town)</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/style.css?v=2.2" />
</head>
<body>
  <div id="game-container">
    <!-- 2.5D 等角視角繪本世界畫布 -->
    <canvas id="world-canvas"></canvas>

    <!-- 頂部 HUD 狀態與導覽列 -->
    <header id="top-hud">
      <div class="hud-group">
        <!-- ❤️ 體力條 -->
        <div class="hud-pill">
          <span>❤️</span>
          <span data-zhuyin="體力"></span>
          <div class="hud-bar-wrap">
            <div id="hud-hp-fill" class="hud-bar-fill hp" style="width: 100%"></div>
          </div>
        </div>

        <!-- ⭐ 經驗條 -->
        <div class="hud-pill">
          <span>⭐</span>
          <strong id="hud-lv-val" style="color:#e04580;">Lv.1</strong>
          <div class="hud-bar-wrap">
            <div id="hud-exp-fill" class="hud-bar-fill exp" style="width: 20%"></div>
          </div>
        </div>

        <!-- 🌟 星光碎片收集進度 -->
        <div class="hud-pill">
          <span>🌈</span>
          <span data-zhuyin="星光碎片"></span>
          <strong id="hud-shard-val" style="color:#9f67ff;">1 / 5</strong>
        </div>

        <!-- 💰 金幣 -->
        <div class="hud-pill">
          <span>💰</span>
          <span data-zhuyin="金幣"></span>
          <strong id="hud-coin-val" style="color:#d97706;">150</strong>
        </div>

        <!-- 📍 當前地圖名稱 -->
        <div class="hud-pill" style="background:#fff0f6;">
          <span id="hud-map-name" data-zhuyin="🏘️ 星光鎮中心廣場"></span>
        </div>
      </div>

      <!-- 右上角四大區域一鍵切換與音樂設定 -->
      <div class="hud-group">
        <button class="hud-btn" style="background:linear-gradient(180deg,#fff,#ffd6eb);" onclick="window.GameApp.travelToMap('town', 1380, 920)">
          <span>🏘️</span>
          <span data-zhuyin="星光鎮"></span>
        </button>
        <button class="hud-btn" style="background:linear-gradient(180deg,#fff,#c7f9cc);" onclick="window.GameApp.travelToMap('creek', 1350, 780)">
          <span>🌲🎣</span>
          <span data-zhuyin="清溪釣魚"></span>
        </button>
        <button class="hud-btn" style="background:linear-gradient(180deg,#fff,#fff3b0);" onclick="window.GameApp.travelToMap('ranch', 1280, 820)">
          <span>🌾🐑</span>
          <span data-zhuyin="陽光牧場"></span>
        </button>
        <button class="hud-btn" style="background:linear-gradient(180deg,#fff,#caf0f8);" onclick="window.GameApp.travelToMap('coast', 1950, 720)">
          <span>🏖️🌊</span>
          <span data-zhuyin="海岸海釣"></span>
        </button>
        <button class="hud-btn" onclick="window.GameApp.openModal('worldmap-modal')">
          <span>🗺️</span>
          <span data-zhuyin="全覽"></span>
        </button>
        <button id="bgm-toggle-btn" class="hud-btn" onclick="window.GameApp.toggleBGMButton()">
          <span>🎵</span>
          <span data-zhuyin="音樂"></span>
        </button>
      </div>
    </header>

    <!-- 🐾 右上角小貓代理店長自動賣餐通知列 -->
    <div id="cat-toast-container"></div>

    <!-- 🕹️ 左下角雙圈彩色觸控搖桿 -->
    <div id="joystick-zone" title="拖曳搖桿移動主角">
      <div class="joystick-outer-ring">
        <div class="joystick-inner-ring"></div>
        <div id="joystick-knob">⭐</div>
      </div>
    </div>

    <!-- 🚲 右下角主功能操作按鈕群 -->
    <div id="action-buttons">
      <div class="action-row">
        <button class="action-btn" style="background:linear-gradient(180deg,#d8f3dc,#95d5b2);" onclick="window.GameApp.openModal('shop-ranch-modal')">
          <span class="btn-icon">🐑</span>
          <span data-zhuyin="牧場與買飼料"></span>
        </button>
        <button class="action-btn" style="background:linear-gradient(180deg,#caf0f8,#90e0ef);" onclick="window.FishingRanch.openFishingSpot(window.GameApp.world.currentMap === 'coast' ? 'sea' : 'creek')">
          <span class="btn-icon">🎣</span>
          <span data-zhuyin="溪海釣魚"></span>
        </button>
      </div>
      <div class="action-row">
        <button class="action-btn primary-gold" onclick="window.GameApp.openModal('restaurant-modal')">
          <span class="btn-icon">🏡</span>
          <span data-zhuyin="星光餐廳"></span>
        </button>
        <button class="action-btn primary-purple" onclick="window.GameApp.openModal('minigame-modal')">
          <span class="btn-icon">🎮</span>
          <span data-zhuyin="小遊戲關卡"></span>
        </button>
      </div>
      <div class="action-row">
        <button class="action-btn" onclick="window.GameApp.world.cycleVehicle()">
          <span class="btn-icon">🚲</span>
          <span data-zhuyin="上下車"></span>
        </button>
        <button class="action-btn" onclick="window.GameApp.world.triggerNearbyInteraction()">
          <span class="btn-icon">✋</span>
          <span id="interact-btn-label" data-zhuyin="互動"></span>
        </button>
        <button class="action-btn primary-pink" onclick="window.GameApp.openModal('dressing-modal')">
          <span class="btn-icon">👚</span>
          <span data-zhuyin="換裝"></span>
        </button>
      </div>
    </div>

    <!-- 💬 國小低年級直式注音對話框 + 右上角小喇叭 🔊 TTS -->
    <div id="dialogue-box" class="hidden">
      <button class="tts-speaker-btn" onclick="window.GameApp.speakCurrentDialogue()" title="甜美女聲朗讀">
        <span>🔊</span>
        <span data-zhuyin="語音朗讀"></span>
      </button>
      <button class="dialogue-close-btn" onclick="window.GameApp.closeDialogue()" title="關閉對話">✕</button>

      <div class="dialogue-avatar">
        <img id="dialogue-avatar-img" src="assets/sprites/prop_bear_shop.png" alt="NPC" />
      </div>
      <div class="dialogue-content">
        <div id="dialogue-speaker" class="dialogue-speaker"></div>
        <div id="dialogue-text" class="dialogue-text"></div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       🗺️ 彈窗 0：《哆啦A夢 牧場物語》風格 4 大區域世界地圖導覽
       ========================================================================== -->
  <div id="worldmap-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <span>🗺️</span>
          <span data-zhuyin="星光鎮自然王國：四大相連地圖導覽"></span>
        </div>
        <button class="hud-btn" onclick="window.GameApp.closeAllModals()">
          <span>✕</span>
          <span data-zhuyin="關閉地圖"></span>
        </button>
      </div>

      <div class="modal-body">
        <div class="minigame-grid">
          <div class="mg-card">
            <div style="display:flex; gap:12px; align-items:center;">
              <img src="assets/maps/map_town.jpg" alt="星光鎮廣場" style="width:140px; height:86px; object-fit:cover; border-radius:14px; border:2.5px solid #5e3a24;" />
              <div>
                <h3 style="margin:0 0 6px; font-size:20px;" data-zhuyin="🏘️ 星光鎮中心廣場"></h3>
                <p style="margin:0; font-size:14px;" data-zhuyin="星光餐廳、彩虹噴泉、熊熊雜貨鋪（買飼料）與麵包兔烘焙坊。"></p>
              </div>
            </div>
            <button class="action-btn primary-pink" style="margin-top:10px;" onclick="window.GameApp.travelToMap('town', 1380, 920)">
              <span data-zhuyin="前往星光鎮廣場"></span>
            </button>
          </div>

          <div class="mg-card">
            <div style="display:flex; gap:12px; align-items:center;">
              <img src="assets/maps/map_creek.jpg" alt="微風清溪" style="width:140px; height:86px; object-fit:cover; border-radius:14px; border:2.5px solid #5e3a24;" />
              <div>
                <h3 style="margin:0 0 6px; font-size:20px;" data-zhuyin="🌲 微風清溪與夢幻森林"></h3>
                <p style="margin:0; font-size:14px;" data-zhuyin="【溪釣勝地】走過木橋釣黃金香魚與櫻花鱒，採集森林蘑菇與草莓！"></p>
              </div>
            </div>
            <button class="action-btn primary-purple" style="margin-top:10px;" onclick="window.GameApp.travelToMap('creek', 960, 760)">
              <span data-zhuyin="前往微風清溪（溪釣）"></span>
            </button>
          </div>

          <div class="mg-card">
            <div style="display:flex; gap:12px; align-items:center;">
              <img src="assets/maps/map_ranch.jpg" alt="陽光畜牧農場" style="width:140px; height:86px; object-fit:cover; border-radius:14px; border:2.5px solid #5e3a24;" />
              <div>
                <h3 style="margin:0 0 6px; font-size:20px;" data-zhuyin="🌾 陽光畜牧農場"></h3>
                <p style="margin:0; font-size:14px;" data-zhuyin="【養羊與養雞】在木柵欄餵食小綿羊與咕咕雞，收穫黃金雞蛋、羊奶與羊毛！"></p>
              </div>
            </div>
            <button class="action-btn primary-gold" style="margin-top:10px;" onclick="window.GameApp.travelToMap('ranch', 1020, 820)">
              <span data-zhuyin="前往陽光畜牧農場"></span>
            </button>
          </div>

          <div class="mg-card">
            <div style="display:flex; gap:12px; align-items:center;">
              <img src="assets/maps/map_coast.jpg" alt="蔚藍海岸" style="width:140px; height:86px; object-fit:cover; border-radius:14px; border:2.5px solid #5e3a24;" />
              <div>
                <h3 style="margin:0 0 6px; font-size:20px;" data-zhuyin="🏖️ 蔚藍海岸與木棧碼頭"></h3>
                <p style="margin:0; font-size:14px;" data-zhuyin="【海釣碼頭】走上木棧道釣粉紅星光鯛魚与藍寶石鮪魚，找水手鴨玩貝殼派對！"></p>
              </div>
            </div>
            <button class="action-btn primary-pink" style="margin-top:10px;" onclick="window.GameApp.travelToMap('coast', 1920, 740)">
              <span data-zhuyin="前往蔚藍海岸（海釣）"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       🎣 彈窗 1B：溪釣與海釣互動系統 (Creek & Sea Fishing Modal)
       ========================================================================== -->
  <div id="fishing-modal" class="modal-overlay hidden">
    <div class="modal-card" style="height:min(580px, 88vh);">
      <div class="modal-header">
        <div class="modal-title">
          <span>🎣</span>
          <span id="fishing-modal-title" data-zhuyin="星光垂釣樂園"></span>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="hud-btn" onclick="window.FishingRanch.openFishingSpot('creek')">
            <span>🏞️</span> <span data-zhuyin="切換溪釣"></span>
          </button>
          <button class="hud-btn" onclick="window.FishingRanch.openFishingSpot('sea')">
            <span>🌊</span> <span data-zhuyin="切換海釣"></span>
          </button>
          <button class="hud-btn" onclick="window.GameApp.closeAllModals()">
            <span>✕</span> <span data-zhuyin="收竿返回"></span>
          </button>
        </div>
      </div>

      <div class="modal-body" style="flex-direction:column; align-items:center; justify-content:space-between;">
        <div id="fishing-bag-summary" style="display:flex; gap:24px; font-size:18px; background:#fff; padding:8px 24px; border-radius:99px; border:3px solid #5e3a24;"></div>
        <canvas id="fishing-canvas" width="720" height="310" style="border:3.5px solid #5e3a24; border-radius:24px; cursor:pointer; max-width:100%;"></canvas>
        <div style="display:flex; gap:14px; align-items:center;">
          <button id="fishing-action-btn" class="action-btn primary-pink" style="min-width:240px; font-size:20px;" onclick="window.FishingRanch.handleFishingAction()"></button>
          <button class="action-btn primary-gold" onclick="window.GameApp.openModal('restaurant-modal')">
            <span>🍳</span> <span data-zhuyin="帶魚去餐廳做料理"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       🐑 彈窗 1C：熊熊雜貨鋪買飼料 & 陽光牧場養羊養雞系統
       ========================================================================== -->
  <div id="shop-ranch-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <span>🐻🐑</span>
          <span data-zhuyin="熊熊雜貨鋪（買飼料）＆ 陽光牧場畜牧管理"></span>
        </div>
        <button class="hud-btn" onclick="window.GameApp.closeAllModals()">
          <span>✕</span>
          <span data-zhuyin="返回小鎮"></span>
        </button>
      </div>

      <div class="modal-body">
        <!-- 左側：🐻 熊熊店長飼料與小動物商店 -->
        <div class="rest-col-left" style="width:48%;">
          <div class="cute-panel" style="flex:1;">
            <div style="font-size:19px; color:#e04580; margin-bottom:10px; display:flex; align-items:center; gap:8px;">
              <img src="assets/sprites/item_feed_bag.png" alt="飼料" style="width:42px; height:42px; object-fit:contain;" />
              <span data-zhuyin="🐻 熊熊店長飼料與幼畜商店"></span>
            </div>

            <div class="upgrade-list">
              <div class="upgrade-item">
                <div style="display:flex; align-items:center; gap:10px;">
                  <img src="assets/sprites/item_feed_bag.png" alt="雞飼料" />
                  <div>
                    <div style="font-size:17px;" data-zhuyin="🌽 黃金穀物飼料（3包）"></div>
                    <div style="font-size:13px; color:#666;" data-zhuyin="餵飽咕咕雞，產出黃金土雞蛋！"></div>
                  </div>
                </div>
                <button class="hud-btn" onclick="window.FishingRanch.buyShopItem('chicken_feed')">
                  💰 10 <span data-zhuyin="購買"></span>
                </button>
              </div>

              <div class="upgrade-item">
                <div style="display:flex; align-items:center; gap:10px;">
                  <img src="assets/sprites/item_feed_bag.png" alt="羊飼料" />
                  <div>
                    <div style="font-size:17px;" data-zhuyin="🌿 香甜牧草飼料（3包）"></div>
                    <div style="font-size:13px; color:#666;" data-zhuyin="餵飽小綿羊，產出濃醇羊奶與羊毛！"></div>
                  </div>
                </div>
                <button class="hud-btn" onclick="window.FishingRanch.buyShopItem('sheep_feed')">
                  💰 15 <span data-zhuyin="購買"></span>
                </button>
              </div>

              <div class="upgrade-item">
                <div style="display:flex; align-items:center; gap:10px;">
                  <img src="assets/sprites/animal_chicken.png" alt="咕咕雞" />
                  <div>
                    <div style="font-size:17px;" data-zhuyin="🐔 領養「黃金咕咕雞」"></div>
                    <div style="font-size:13px; color:#666;" data-zhuyin="放養到陽光牧場圍欄裡生雞蛋"></div>
                  </div>
                </div>
                <button class="hud-btn" onclick="window.FishingRanch.buyShopItem('buy_chicken')">
                  💰 50 <span data-zhuyin="領養"></span>
                </button>
              </div>

              <div class="upgrade-item">
                <div style="display:flex; align-items:center; gap:10px;">
                  <img src="assets/sprites/animal_sheep.png" alt="小綿羊" />
                  <div>
                    <div style="font-size:17px;" data-zhuyin="🐑 領養「軟綿綿小羊」"></div>
                    <div style="font-size:13px; color:#666;" data-zhuyin="放養到陽光牧場圍欄裡產羊奶與羊毛"></div>
                  </div>
                </div>
                <button class="hud-btn" onclick="window.FishingRanch.buyShopItem('buy_sheep')">
                  💰 70 <span data-zhuyin="領養"></span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 右側：🏡 陽光牧場餵食與農產品收穫 -->
        <div class="rest-col-right" style="width:52%;">
          <div class="cute-panel">
            <div style="font-size:19px; color:#2a9d8f; margin-bottom:8px;">
              <span>🏡</span>
              <span data-zhuyin="陽光畜牧農場：飼料與產物庫存"></span>
            </div>

            <div class="ingredient-bar">
              <div class="ing-badge">
                <div>🌽 <span data-zhuyin="穀物飼料"></span></div>
                <strong id="shop-chicken-feed-val" style="font-size:20px; color:#d97706;">3</strong>
              </div>
              <div class="ing-badge">
                <div>🌿 <span data-zhuyin="牧草飼料"></span></div>
                <strong id="shop-sheep-feed-val" style="font-size:20px; color:#2a9d8f;">3</strong>
              </div>
              <div class="ing-badge">
                <div>🥚 <span data-zhuyin="黃金雞蛋"></span></div>
                <strong id="ranch-egg-val" style="font-size:20px; color:#e04580;">2</strong>
              </div>
              <div class="ing-badge">
                <div>🧶 <span data-zhuyin="蓬蓬羊毛"></span></div>
                <strong id="ranch-wool-val" style="font-size:20px; color:#9f67ff;">1</strong>
              </div>
            </div>

            <div style="margin-top:14px; display:flex; align-items:center; justify-content:space-around; background:#fff9fb; border:2.5px dashed #ff6fa5; border-radius:20px; padding:12px;">
              <div style="text-align:center;">
                <img src="assets/sprites/animal_chicken.png" alt="雞" style="width:68px; height:68px; object-fit:contain;" />
                <div>🐔 <span data-zhuyin="牧場咕咕雞"></span>: <strong id="ranch-chicken-count">3</strong> <span data-zhuyin="隻"></span></div>
              </div>
              <div style="text-align:center;">
                <img src="assets/sprites/animal_sheep.png" alt="羊" style="width:68px; height:68px; object-fit:contain;" />
                <div>🐑 <span data-zhuyin="牧場小綿羊"></span>: <strong id="ranch-sheep-count">2</strong> <span data-zhuyin="隻"></span></div>
              </div>
            </div>

            <div style="margin-top:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
              <button class="action-btn primary-pink" onclick="window.FishingRanch.feedAllAnimalsInModal()">
                <span>❤️</span>
                <span data-zhuyin="一鍵餵食所有小雞與小羊（收穫雞蛋/羊奶/羊毛）"></span>
              </button>
              <button class="action-btn primary-gold" onclick="window.GameApp.travelToMap('ranch', 1280, 820)">
                <span>🌾</span>
                <span data-zhuyin="親自去陽光牧場看小羊"></span>
              </button>
            </div>
          </div>

          <div class="cute-panel" style="display:flex; align-items:center; justify-content:space-between;">
            <div style="display:flex; align-items:center; gap:12px;">
              <img src="assets/sprites/item_egg_wool.png" alt="羊毛籃" style="width:60px; height:60px; object-fit:contain;" />
              <div>
                <div style="font-size:17px;" data-zhuyin="🧶 牧場羊毛手工編織坊"></div>
                <div style="font-size:13px; color:#666;" data-zhuyin="用 1 個蓬蓬羊毛織成「暖暖絨毛斗篷」並賺取 60 金幣！"></div>
              </div>
            </div>
            <button class="hud-btn" onclick="window.FishingRanch.weaveWoolOutfit()">
              <span>🧶</span> <span data-zhuyin="編織羊毛斗篷"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       🏪 彈窗 1：星光餐廳雙重經營系統 (5 大採集/牧場/鮮魚食譜 + 小貓代理掛機)
       ========================================================================== -->
  <div id="restaurant-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <span>🏡</span>
          <span data-zhuyin="星光餐廳雙重經營系統（採集・牧場・鮮魚料理）"></span>
        </div>
        <button class="hud-btn" onclick="window.GameApp.closeAllModals()">
          <span>✕</span>
          <span data-zhuyin="返回小鎮"></span>
        </button>
      </div>

      <div class="modal-body">
